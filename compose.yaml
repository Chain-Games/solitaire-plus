# Dev Postgres + Redis for Solitaire Plus (mirrors Blockari's compose.yaml + devports).
#   sg docker -c "docker compose up -d"
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: solitaire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solitaire}
      POSTGRES_DB: solitaire
    ports:
      - '127.0.0.1:5459:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'psql -U solitaire -d solitaire -c "SELECT 1"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    ports:
      - '127.0.0.1:6399:6379'
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
